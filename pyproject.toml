[project]
name = "minimal-hubert"
description = "Minimal implementation of HuBERT pretraining"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Maxime Poli" }]
dependencies = [
  "fastabx>=0.6.1",
  "filelock>=3.20.2",
  "huggingface-hub>=1.11.0",
  "orjson>=3.11.5",
  "polars>=1.40.0",
  "safetensors>=0.7.0",
  "scikit-learn>=1.8.0",
  "spidr[train]>=0.2.0",
  "torch>=2.12.1",
  "torchaudio>=2.11.0",
  "torchcodec>=0.14.0",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/mxmpl/minimal_hubert"

[dependency-groups]
dev = [
  "prek>=0.3.10",
]
test = [
  "hypothesis>=6.150.0",
  "pytest>=9.0.2",
  "s3prl>=0.4.18",
  "transformers>=4.57.3",
]

[build-system]
requires = ["hatch-vcs", "hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.ruff]
line-length = 119

[tool.ruff.lint]
preview = true
select = [
  "correctness",
  "suspicious",
  "complexity",
  "performance",
  "style",
  "pedantic",
  "formatting",
  "security",
]
ignore = [
  "missing-trailing-comma",
  "CPY",  # flake8-copyright
  "D",  # pydocstyle
  "S",  # flake8-bandit
  "TRY",  # tryceratops
]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str"]
max-args = 10
max-statements = 75

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["F"]  # from torch.nn import functional as F

[tool.typos.default.extend-words]
interm = "interm"
